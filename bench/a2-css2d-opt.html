<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A′ · CSS 2D matrix() 면 (최적화)</title>
<style>
/* A와 같은 그림·같은 호버/값 변경 트랜지션. 다른 점은 두 가지뿐이다.
   1) 블록 위치 변수(--x, --y, --i)를 inherits: false로 등록한다. 면(i)에 상속되지 않으므로
      같은 높이·같은 색 블록의 면끼리 계산된 스타일이 같아질 수 있다.
   2) 높이를 정수 px(h·u)가 되도록 반올림한다. 높이 값의 가짓수가 줄어든다(오차 ≤ 0.5px). */
@property --x { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --y { syntax: "<number>"; inherits: false; initial-value: 0; }
@property --i { syntax: "<integer>"; inherits: false; initial-value: 0; }
@property --h { syntax: "<number>"; inherits: true; initial-value: 1; }
html, body { margin: 0; background: #f6f5f1; overflow: hidden; }
.scene { position: relative; width: 1366px; height: 768px; }
.origin { position: absolute; }
.blk {
  --c: #4e79a7;
  position: absolute;
  left: calc((var(--x) - var(--y)) * 0.866 * var(--u));
  top: calc((var(--x) + var(--y)) * 0.5 * var(--u));
  z-index: var(--i);
  transition: transform 0.18s ease-out, --h 0.18s ease-out;
}
.blk > i { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; }
.blk .t {
  width: var(--u); height: var(--u);
  background: var(--c);
  transform: translateY(calc(var(--h) * var(--u) * -1)) matrix(0.866, 0.5, -0.866, 0.5, 0, 0);
}
.blk .l {
  width: var(--u); height: calc(var(--h) * var(--u));
  background: color-mix(in oklch, var(--c), black 18%);
  transform: translate(calc(var(--u) * -0.866), calc((0.5 - var(--h)) * var(--u))) matrix(0.866, 0.5, 0, 1, 0, 0);
}
.blk .r {
  width: var(--u); height: calc(var(--h) * var(--u));
  background: color-mix(in oklch, var(--c), black 34%);
  transform: translate(calc(var(--u) * 0.866), calc((0.5 - var(--h)) * var(--u))) matrix(-0.866, 0.5, 0, 1, 0, 0);
}
.blk:hover { transform: translateY(-6px); }
</style>
</head>
<body>
<div class="scene"><div class="origin" id="origin"></div></div>
<script type="module">
import { readN, layout, markRendered } from './common.js';
const L = layout(readN());
// h·u가 정수 px가 되도록 반올림한 높이.
const px = (h) => Math.round(h * L.u) / L.u;
const o = document.getElementById('origin');
o.style.cssText = `left:${L.ox}px;top:${L.oy}px;--u:${L.u}px`;
let html = '';
for (const b of L.blocks) {
  html += `<div class="blk" style="--x:${b.x};--y:${b.y};--h:${px(b.h)};--i:${b.z};--c:${b.c}"><i class="l"></i><i class="r"></i><i class="t"></i></div>`;
}
o.innerHTML = html;
const els = o.children;
markRendered(L, {
  setHeights(k) {
    for (const b of L.blocks) els[b.i].style.setProperty('--h', px(b.heights[k]));
  },
});
</script>
</body>
</html>
