<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C · SVG polygon</title>
<style>
html, body { margin: 0; background: #f6f5f1; overflow: hidden; }
svg { display: block; }
.b { transition: transform 0.18s ease-out; }
.b:hover { transform: translateY(-6px); }
</style>
</head>
<body>
<svg id="s" width="1366" height="768" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
import { readN, layout, faces, shade, markRendered, tweenHeights } from './common.js';
const L = layout(readN());
const pts = (a) => a.map(([x, y]) => `${(L.ox + x).toFixed(1)},${(L.oy + y).toFixed(1)}`).join(' ');
let html = '';
for (const b of L.order) {
  const f = faces(b, L.u);
  html += `<g class="b"><polygon points="${pts(f.left)}" fill="${shade(b.c, 0.18)}"/><polygon points="${pts(f.right)}" fill="${shade(b.c, 0.34)}"/><polygon points="${pts(f.top)}" fill="${b.c}"/></g>`;
}
const svg = document.getElementById('s');
svg.innerHTML = html;
// 값 변경: 엘리먼트가 하듯 바뀐 높이로 points 속성을 다시 쓴다(180ms 보간, 프레임마다).
const groups = svg.children; // L.order 순서
function writePoints() {
  for (let k = 0; k < L.order.length; k++) {
    const f = faces(L.order[k], L.u);
    const [l, r, t] = groups[k].children;
    l.setAttribute('points', pts(f.left));
    r.setAttribute('points', pts(f.right));
    t.setAttribute('points', pts(f.top));
  }
}
markRendered(L, { setHeights: (k) => tweenHeights(L, k, writePoints) });
</script>
</body>
</html>
