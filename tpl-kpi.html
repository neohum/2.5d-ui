  <h1>원격 수업 KPI 보드</h1>
  <p class="lede">한 주 동안의 원격 수업 운영 지표 여섯 개와 학년별 비교입니다.</p>
  <span class="badge">예시 데이터 · 실제 학교 기록이 아닙니다</span>
</section>

<section aria-labelledby="week">
  <h2 id="week">이번 주</h2>

    <div class="card"><iso-kpi value="94" max="100" suffix="%" label="출석률"></iso-kpi></div>
    <div class="card"><iso-kpi value="87" max="100" suffix="%" label="과제 제출률"></iso-kpi></div>
    <div class="card"><iso-kpi value="41" max="50" suffix="분" label="평균 수업 참여 시간"></iso-kpi></div>
    <div class="card"><iso-kpi value="12" max="40" suffix="건" label="접속 장애 신고"></iso-kpi></div>
    <div class="card"><iso-kpi value="4.3" max="5" suffix="점" label="수업 만족도"></iso-kpi></div>
    <div class="card"><iso-kpi value="118" max="120" suffix="대" label="정상 작동 기기"></iso-kpi></div>
  </div>
</section>
