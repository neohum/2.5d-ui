<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2.5d-ui · iso-layers 데모</title>
<link rel="stylesheet" href="/packages/core/src/css/index.css">
<link rel="stylesheet" href="/packages/core/src/css/edu.css">
<style>
  /* 데모 페이지 꾸밈만. 다크 테마에서 페이지 배경도 어둡게(grid.html과 같은 방식). */
  :root { color-scheme: light; --page-bg: #f2f4f7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --page-bg: #11151b; }
  }
  [data-theme="dark"] { color-scheme: dark; --page-bg: #11151b; }
  body {
    margin: 0; padding: 24px; background: var(--page-bg); color: var(--iso-ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  main { display: grid; gap: 32px; max-width: 960px; }
  figure { margin: 0; display: grid; gap: 8px; overflow-x: auto; }
  figcaption { font-weight: 600; }
  output { font-size: 13px; color: var(--iso-ink-muted); }
</style>
<script type="module" src="/packages/core/src/edu.ts"></script>
</head>
<body>
<main>
  <!-- 가상의 데이터. 단원별 평균 성취도(%). data[0]이 맨 아래 층. -->
  <figure id="achievement">
    <figcaption>성취기준 층 구조 — 학년별 수학 단원 평균 성취도(%), 3학년 펼침</figcaption>
    <iso-layers label="학년별 수학 단원 평균 성취도(%)" max="100" height-units="3" open="1" data='[
      {"k":"2학년","items":[{"k":"세 자리 수","v":88},{"k":"여러 가지 도형","v":84},{"k":"덧셈과 뺄셈","v":81},{"k":"곱셈","v":76}]},
      {"k":"3학년","items":[{"k":"평면도형","v":82},{"k":"나눗셈","v":71},{"k":"곱셈","v":77},{"k":"길이와 시간","v":79},{"k":"분수와 소수","v":64}]},
      {"k":"4학년","items":[{"k":"큰 수","v":84},{"k":"각도","v":76},{"k":"분수","v":61},{"k":"막대그래프","v":88},{"k":"규칙 찾기","v":79},{"k":"소수","v":66}]},
      {"k":"5학년","items":[{"k":"약수와 배수","v":71},{"k":"약분과 통분","v":58},{"k":"다각형 둘레","v":75},{"k":"합동과 대칭","v":80}]},
      {"k":"6학년","items":[{"k":"분수의 나눗셈","v":63},{"k":"각기둥","v":77},{"k":"비와 비율","v":69}]}
    ]'></iso-layers>
    <output id="picked">블록을 누르거나 ↑↓←→로 옮겨 보세요.</output>
  </figure>

  <figure id="system">
    <figcaption>작은 3층 구조 — 학교 시스템 계층(가상 사용률 %), 빈 층 포함</figcaption>
    <iso-layers label="학교 시스템 계층 사용률(%)" max="100" height-units="2" data='[
      {"k":"기기","items":[{"k":"크롬북","v":82},{"k":"태블릿","v":40}]},
      {"k":"플랫폼","items":[{"k":"학습관리","v":67},{"k":"메일","v":35},{"k":"드라이브","v":58}]},
      {"k":"앱","items":[]}
    ]'></iso-layers>
  </figure>
</main>
<script type="module">
  const out = document.getElementById("picked");
  document.querySelector("#achievement iso-layers").addEventListener("iso-select", (e) => {
    const { item, index } = e.detail;
    out.textContent = index < 0 ? `${item.k} 판` : `${item.k}: ${item.v}%`;
  });
</script>
</body>
</html>
